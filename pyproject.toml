[project]
name = "bikeshare"
version = "0.1.0"
description = "Toronto Bike Share demand forecaster and station recommender"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.0",
    "holidays>=0.107",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "polars>=1.0",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.31",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the real pipeline output in data/ (run `make process`)"]
